<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro × Spotify — GaiaSentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}
body{font-family:'Space Grotesk',system-ui,sans-serif;}
input,button,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:3px;}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%;}
input[type=range]::-webkit-slider-track{height:4px;background:rgba(128,128,128,.2);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:currentColor;margin-top:-5px;transition:transform .15s,box-shadow .15s;}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:currentColor;border:none;}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 10px currentColor;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.fu{animation:fadeUp .25s ease-out both;}
.pop{animation:popIn .2s ease-out both;}
.pulse{animation:pulse 2s ease-in-out infinite;}
button{cursor:pointer;border:none;outline:none;background:transparent;}
button:focus-visible{outline:2px solid rgba(128,128,128,.5);outline-offset:2px;}
@media(max-width:768px){.hide-mobile{display:none;}}
</style>
</head>
<body>
<div id="root"></div>

<!-- Spotify Web Playback SDK (loaded async) -->
<script>window.onSpotifyWebPlaybackSDKReady=()=>{window.__sdkReady=true;window.__sdkRes&&window.__sdkRes();};</script>

<script type="text/babel">
{% raw %}
const{useState,useEffect,useRef,useCallback}=React;

/* ═══════════════════════════════════════════════════════════════════════════
   THEME SYSTEM
═══════════════════════════════════════════════════════════════════════════ */
const THEMES={
  dark:{
    name:'Dark',
    bg:'#0A0A16',surf:'#12121E',card:'#1A1A2E',border:'rgba(255,255,255,.08)',
    text:'#E8E8FF',mid:'#A0A0C0',muted:'#606080',accent:'#8B5CF6',
    focus:'#34D399',short:'#818CF8',long:'#C084FC',spotify:'#1DB954'
  },
  light:{
    name:'Light',
    bg:'#F8F9FC',surf:'#FFFFFF',card:'#F0F1F5',border:'rgba(0,0,0,.08)',
    text:'#1A1A2E',mid:'#4A4A5E',muted:'#8A8A9E',accent:'#7C3AED',
    focus:'#059669',short:'#4F46E5',long:'#9333EA',spotify:'#1DB954'
  },
  ocean:{
    name:'Ocean',
    bg:'#0C1929',surf:'#0F2137',card:'#152A44',border:'rgba(56,189,248,.12)',
    text:'#E0F2FE',mid:'#7DD3FC',muted:'#38BDF8',accent:'#0EA5E9',
    focus:'#22D3EE',short:'#3B82F6',long:'#8B5CF6',spotify:'#1DB954'
  },
  sunset:{
    name:'Sunset',
    bg:'#1A0F0A',surf:'#241410',card:'#2E1A14',border:'rgba(251,146,60,.12)',
    text:'#FFE4D6',mid:'#FDBA8C',muted:'#FB923C',accent:'#F97316',
    focus:'#F59E0B',short:'#EF4444',long:'#EC4899',spotify:'#1DB954'
  },
  forest:{
    name:'Forest',
    bg:'#0A1A0F',surf:'#0F2414',card:'#142E1A',border:'rgba(34,197,94,.12)',
    text:'#DCFCE7',mid:'#86EFAC',muted:'#22C55E',accent:'#16A34A',
    focus:'#4ADE80',short:'#22C55E',long:'#10B981',spotify:'#1DB954'
  },
  midnight:{
    name:'Midnight',
    bg:'#030712',surf:'#0B0F19',card:'#111827',border:'rgba(99,102,241,.15)',
    text:'#EEF2FF',mid:'#A5B4FC',muted:'#6366F1',accent:'#818CF8',
    focus:'#34D399',short:'#6366F1',long:'#A855F7',spotify:'#1DB954'
  }
};

const getTheme=(name)=>THEMES[name]||THEMES.dark;

/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS (mode colors - theme agnostic)
═══════════════════════════════════════════════════════════════════════════ */
const MODE={
  focus:{key:'focus',label:'Focus',      secs:25*60},
  short:{key:'short',label:'Short Break',secs:5*60},
  long: {key:'long', label:'Long Break', secs:15*60},
};

// Mode colors are theme-dependent, assigned in component

/* ═══════════════════════════════════════════════════════════════════════════
   SPOTIFY HELPERS
═══════════════════════════════════════════════════════════════════════════ */
let _cachedToken=null,_tokenExpiry=0;

const getToken=async()=>{
  if(_cachedToken&&Date.now()<_tokenExpiry-5000)return _cachedToken;
  const r=await fetch('/api/token');
  if(!r.ok){_cachedToken=null;return null;}
  const d=await r.json();
  _cachedToken=d.access_token;
  _tokenExpiry=Date.now()+50*60*1000;
  return _cachedToken;
};

const sapi=async(path,method='GET',body=null)=>{
  const tok=await getToken();
  if(!tok)return null;
  const r=await fetch('https://api.spotify.com/v1'+path,{
    method,
    headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
    body:body?JSON.stringify(body):null,
  });
  if(r.status===204||r.status===202||(!r.ok&&method!=='GET'))return null;
  if(!r.ok)return null;
  try{return await r.json();}catch{return null;}
};

/* ═══════════════════════════════════════════════════════════════════════════
   AMBIENT SOUNDS
═══════════════════════════════════════════════════════════════════════════ */
const makeAmbient=(type,vol)=>{
  const ctx=new AudioContext(),gain=ctx.createGain();
  gain.gain.value=vol/100*.25;gain.connect(ctx.destination);
  const srcs=[];
  if(type==='rain'){
    const sz=ctx.sampleRate*4,buf=ctx.createBuffer(2,sz,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);let l=0;for(let i=0;i<sz;i++)d[i]=l=(l+.02*(Math.random()*2-1))/1.02*3.5;}
    const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
    s.connect(f);f.connect(gain);s.start();srcs.push(s);
  } else if(type==='white'){
    const sz=ctx.sampleRate*2,buf=ctx.createBuffer(1,sz,ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<sz;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.connect(gain);s.start();srcs.push(s);
  } else if(type==='focus'){
    [[200,-1],[210,1]].forEach(([f,pan])=>{
      const o=ctx.createOscillator(),p=ctx.createStereoPanner(),g=ctx.createGain();
      o.frequency.value=f;p.pan.value=pan;g.gain.value=.2;
      o.connect(g);g.connect(p);p.connect(gain);o.start();srcs.push(o);
    });
  }
  return{ctx,gain,srcs,setVol:v=>gain.gain.setTargetAtTime(v/100*.25,ctx.currentTime,.05),stop:()=>{srcs.forEach(s=>{try{s.stop();}catch{}});ctx.close();}};
};

const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

/* ═══════════════════════════════════════════════════════════════════════════
   SVG RING COMPONENT
═══════════════════════════════════════════════════════════════════════════ */
function Ring({progress,color,size=280,children,theme}){
  const r=size/2-16,circ=2*Math.PI*r;
  return(
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{position:'absolute',inset:0,transform:'rotate(-90deg)'}}>
        <defs>
          <filter id="glo"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={color} stopOpacity="1"/>
            <stop offset="100%" stopColor={color} stopOpacity=".7"/>
          </linearGradient>
        </defs>
        <circle cx={size/2} cy={size/2} r={r} stroke={theme.border} strokeWidth={12} fill="none" strokeLinecap="round"/>
        <circle cx={size/2} cy={size/2} r={r} stroke="url(#grad)" strokeWidth={12} fill="none"
          strokeDasharray={circ} strokeDashoffset={circ*(1-Math.max(0,Math.min(1,progress)))}
          strokeLinecap="round" filter="url(#glo)"
          style={{transition:'stroke-dashoffset .5s linear'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>{children}</div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   SEEK BAR COMPONENT
═══════════════════════════════════════════════════════════════════════════ */
function SeekBar({position,duration,onSeek,theme}){
  const[pos,setPos]=useState(position||0);
  const drag=useRef(false);
  useEffect(()=>{if(!drag.current)setPos(position||0);},[position]);
  const pct=(pos/Math.max(1,duration||1))*100;
  return(
    <div style={{display:'flex',alignItems:'center',gap:'8px',width:'100%'}}>
      <span style={{fontSize:'11px',color:theme.muted,minWidth:'32px',fontFamily:'Space Grotesk'}}>{fmt(Math.floor(pos/1000))}</span>
      <div style={{flex:1,position:'relative',height:'20px',display:'flex',alignItems:'center'}}>
        <div style={{position:'absolute',left:0,right:0,height:'4px',background:theme.card,borderRadius:'2px',overflow:'hidden'}}>
          <div style={{width:pct+'%',height:'100%',background:theme.spotify,borderRadius:'2px',transition:'width .5s linear'}}/>
        </div>
        <input type="range" min={0} max={duration||1} value={pos} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}}
          onChange={e=>setPos(+e.target.value)} onMouseDown={()=>drag.current=true}
          onMouseUp={e=>{drag.current=false;onSeek(+e.target.value);}}/>
      </div>
      <span style={{fontSize:'11px',color:theme.muted,minWidth:'32px',textAlign:'right',fontFamily:'Space Grotesk'}}>{fmt(Math.floor((duration||0)/1000))}</span>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ICON BUTTON
═══════════════════════════════════════════════════════════════════════════ */
const IB=({children,onClick,style:s={},theme,active})=>(
  <button onClick={onClick} style={{width:'40px',height:'40px',borderRadius:'50%',background:active?theme.accent+'22':theme.card,border:'1px solid '+theme.border,color:active?theme.accent:theme.mid,fontSize:'17px',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .18s cubic-bezier(.4,0,.2,1)',...s}}
    onMouseOver={e=>{e.currentTarget.style.background=active?theme.accent+'33':theme.surf;e.currentTarget.style.color=active?theme.accent:theme.text;e.currentTarget.style.transform='scale(1.05)';}}
    onMouseOut={e=>{e.currentTarget.style.background=active?theme.accent+'22':theme.card;e.currentTarget.style.color=active?theme.accent:theme.mid;e.currentTarget.style.transform='scale(1)';}}>
    {children}
  </button>
);

/* ═══════════════════════════════════════════════════════════════════════════
   THEME SELECTOR
═══════════════════════════════════════════════════════════════════════════ */
function ThemeSelector({current,onChange,theme}){
  return(
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginTop:'12px'}}>
      {Object.entries(THEMES).map(([key,t])=>(
        <button key={key} onClick={()=>onChange(key)} style={{padding:'10px 8px',borderRadius:'10px',background:current===key?t.accent+'22':theme.card,border:`2px solid ${current===key?t.accent:theme.border}`,display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',transition:'all .2s'}}
          onMouseOver={e=>{e.currentTarget.style.transform='scale(1.03)';}} onMouseOut={e=>{e.currentTarget.style.transform='scale(1)';}}>
          <div style={{width:'24px',height:'24px',borderRadius:'50%',background:`linear-gradient(135deg,${t.focus},${t.short})`}}/>
          <span style={{fontSize:'11px',fontWeight:600,color:current===key?t.accent:theme.muted}}>{t.name}</span>
        </button>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════════════════════════════ */
function App(){
  /* ── Theme State ── */
  const[themeName,setThemeName]=useState(()=>localStorage.getItem('pomodoro_theme')||'dark');
  const theme=getTheme(themeName);
  const[showThemePicker,setShowThemePicker]=useState(false);

  /* ── Timer State ── */
  const[mode,setMode]=useState('focus');
  const[timeLeft,setTimeLeft]=useState(25*60);
  const[running,setRunning]=useState(false);
  const[session,setSession]=useState(1);
  const[settings,setSettings]=useState({focus:25,short:5,long:15,autoAdv:true,longAfter:4,notifs:false});
  const[showSettings,setShowSettings]=useState(false);
  const timerRef=useRef(null);
  const modeTotal=useRef(25*60);

  /* ── Spotify State ── */
  {% endraw %}
  const[connected,setConnected]=useState({{ 'true' if connected else 'false' }});
  {% raw %}
  const[premium,setPremium]=useState(false);
  const[nowPlay,setNowPlay]=useState(null);
  const[deviceId,setDeviceId]=useState(null);
  const[vol,setVol]=useState(80);
  const[searchQ,setSearchQ]=useState('');
  const[results,setResults]=useState([]);
  const[playlists,setPlaylists]=useState([]);
  const[sdkReady,setSdkReady]=useState(false);
  const pollRef=useRef(null);
  const playerRef=useRef(null);

  /* ── Ambient State ── */
  const[ambient,setAmbient]=useState(null);
  const[ambVol,setAmbVol]=useState(30);
  const ambRef=useRef(null);

  /* ── Persist theme ── */
  useEffect(()=>{localStorage.setItem('pomodoro_theme',themeName);},[themeName]);

  /* ── Spotify init ── */
  useEffect(()=>{
    if(!connected)return;
    (async()=>{
      const me=await sapi('/me');
      const isPrem=me?.product==='premium';setPremium(isPrem);
      const pl=await sapi('/me/playlists?limit=20');
      if(pl?.items)setPlaylists(pl.items);
      if(isPrem)initSDK();
      else startPoll();
    })();
  },[connected]);

  const initSDK=async()=>{
    const sc=document.createElement('script');sc.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(sc);
    await new Promise(res=>{if(window.__sdkReady)res();else window.__sdkRes=res;});
    const tok=await getToken();
    const player=new window.Spotify.Player({
      name:'Pomodoro @ GaiaSentinel',
      getOAuthToken:async cb=>{const t=await getToken();cb(t);},
      volume:vol/100,
    });
    player.addListener('ready',({device_id})=>{
      setDeviceId(device_id);setSdkReady(true);
      sapi('/me/player','PUT',{device_ids:[device_id]});
    });
    player.addListener('player_state_changed',st=>{
      if(!st)return;
      const tr=st.track_window.current_track;
      setNowPlay({name:tr.name,artist:tr.artists.map(a=>a.name).join(', '),album:tr.album.name,art:tr.album.images[0]?.url,playing:!st.paused,duration:st.duration,position:st.position,uri:tr.uri});
    });
    player.connect();playerRef.current=player;
  };

  const startPoll=()=>{
    const poll=async()=>{
      const d=await sapi('/me/player');
      if(d?.item)setNowPlay({name:d.item.name,artist:d.item.artists.map(a=>a.name).join(', '),album:d.item.album.name,art:d.item.album.images[0]?.url,playing:d.is_playing,duration:d.item.duration_ms,position:d.progress_ms,uri:d.item.uri});
    };
    poll();pollRef.current=setInterval(poll,3000);
  };

  useEffect(()=>{if(playerRef.current)playerRef.current.setVolume(vol/100);},[vol]);
  useEffect(()=>()=>{ambRef.current?.stop();clearInterval(pollRef.current);playerRef.current?.disconnect();},[]);

  /* ── Spotify controls ── */
  const play =async()=>await sapi(`/me/player/play${deviceId?'?device_id='+deviceId:''}`, 'PUT');
  const pause=async()=>await sapi('/me/player/pause','PUT');
  const next =async()=>await sapi('/me/player/next','POST');
  const prev =async()=>await sapi('/me/player/previous','POST');
  const seek =async ms=>await sapi(`/me/player/seek?position_ms=${ms}${deviceId?'&device_id='+deviceId:''}`, 'PUT');
  const playUri=async uri=>{
    const isTrack=uri.includes(':track:');
    const body=isTrack?{uris:[uri]}:{context_uri:uri};
    if(deviceId)body.device_id=deviceId;
    await sapi('/me/player/play','PUT',body);
  };
  const doSearch=async()=>{
    if(!searchQ.trim())return;
    const d=await sapi(`/search?q=${encodeURIComponent(searchQ)}&type=track,playlist&limit=8`);
    const tracks=(d?.tracks?.items||[]).map(t=>({type:'track',name:t.name,sub:t.artists.map(a=>a.name).join(', '),art:t.album?.images[2]?.url,uri:t.uri}));
    const pls=(d?.playlists?.items||[]).map(p=>({type:'playlist',name:p.name,sub:p.owner?.display_name,art:p.images[0]?.url,uri:p.uri}));
    setResults([...tracks,...pls]);
  };

  /* ── Timer logic ── */
  const switchMode=useCallback(k=>{
    clearInterval(timerRef.current);setRunning(false);
    const secs=settings[k==='focus'?'focus':k==='short'?'short':'long']*60;
    modeTotal.current=secs;setMode(k);setTimeLeft(secs);
  },[settings]);

  const handleEnd=useCallback(()=>{
    if(settings.notifs&&Notification.permission==='granted')
      new Notification(mode==='focus'?'⏰ Break time! Great work 🎉':'🎯 Back to focus!');
    if(settings.autoAdv){
      if(mode==='focus'){
        const ns=session>=settings.longAfter?1:session+1;
        const nm=session>=settings.longAfter?'long':'short';
        setSession(ns);switchMode(nm);setRunning(true);
      } else {setSession(s=>mode==='long'?1:s);switchMode('focus');setRunning(true);}
    } else setRunning(false);
  },[mode,session,settings,switchMode]);

  useEffect(()=>{
    if(!running)return;
    timerRef.current=setInterval(()=>{
      setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);handleEnd();return 0;}return t-1;});
    },1000);
    return()=>clearInterval(timerRef.current);
  },[running,handleEnd]);

  const toggleRun=()=>{
    if(!running&&timeLeft===0){const s=settings[mode==='focus'?'focus':mode==='short'?'short':'long']*60;setTimeLeft(s);modeTotal.current=s;}
    setRunning(r=>!r);
  };
  const reset=()=>{clearInterval(timerRef.current);setRunning(false);const s=settings[mode==='focus'?'focus':mode==='short'?'short':'long']*60;setTimeLeft(s);modeTotal.current=s;};

  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.code==='Space'){e.preventDefault();toggleRun();}
      if(e.code==='KeyR')reset();
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[running,mode,settings]);

  const toggleAmbient=t=>{
    ambRef.current?.stop();ambRef.current=null;
    if(ambient===t){setAmbient(null);return;}
    setAmbient(t);ambRef.current=makeAmbient(t,ambVol);
  };
  useEffect(()=>{ambRef.current?.setVol(ambVol);},[ambVol]);

  const requestNotif=async()=>{
    const p=await Notification.requestPermission();
    if(p==='granted')setSettings(s=>({...s,notifs:true}));
  };

  const modeColor=mode==='focus'?theme.focus:mode==='short'?theme.short:theme.long;
  const modeLabel=mode==='focus'?'Focus':mode==='short'?'Short Break':'Long Break';
  const modeDim=modeColor+'15';
  const progress=modeTotal.current>0?timeLeft/modeTotal.current:0;
  const urlError=new URLSearchParams(location.search).get('error');

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:theme.bg,overflow:'hidden',transition:'background .3s'}}>

      {/* ── Error banner ── */}
      {urlError&&(
        <div style={{background:theme.accent+'22',borderBottom:'1px solid '+theme.border,padding:'10px 24px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <span style={{fontSize:'13px',color:theme.accent}}>⚠ Spotify error: <strong style={{color:theme.text}}>{decodeURIComponent(urlError)}</strong></span>
          <a href="/" style={{color:theme.muted,fontSize:'12px',textDecoration:'none'}} onMouseOver={e=>e.currentTarget.style.color=theme.text}>Dismiss ×</a>
        </div>
      )}

      {/* ── Top bar ── */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 28px',borderBottom:'1px solid '+theme.border,flexShrink:0,background:theme.surf,transition:'all .3s'}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
          <div style={{fontSize:'24px',filter:'drop-shadow(0 2px 8px rgba(0,0,0,.3))'}}>🍅</div>
          <div>
            <div style={{fontWeight:700,fontSize:'17px',color:theme.text,letterSpacing:'-.3px'}}>Pomodoro</div>
            <div style={{fontSize:'11px',color:theme.muted}}>Space · start &nbsp;•&nbsp; R · reset</div>
          </div>
        </div>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
          {'Notification'in window&&Notification.permission==='default'&&(
            <button onClick={requestNotif} style={{padding:'7px 13px',borderRadius:'10px',background:theme.card,border:'1px solid '+theme.border,color:theme.muted,fontSize:'12px',fontWeight:600,transition:'all .18s'}}
              onMouseOver={e=>{e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;e.currentTarget.style.borderColor=theme.accent;}}
              onMouseOut={e=>{e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;e.currentTarget.style.borderColor=theme.border;}}>🔔 Alerts</button>
          )}
          <button onClick={()=>setShowThemePicker(s=>!s)} style={{padding:'7px 13px',borderRadius:'10px',background:showThemePicker?theme.accent+'22':theme.card,border:'1px solid '+theme.border,color:showThemePicker?theme.accent:theme.muted,fontSize:'12px',fontWeight:600,transition:'all .18s'}}
            onMouseOver={e=>{e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;}}
            onMouseOut={e=>{if(!showThemePicker){e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;}}}>🎨 Theme</button>
          <button onClick={()=>setShowSettings(s=>!s)} style={{padding:'7px 13px',borderRadius:'10px',background:showSettings?theme.accent+'22':theme.card,border:'1px solid '+theme.border,color:showSettings?theme.accent:theme.muted,fontSize:'12px',fontWeight:600,transition:'all .18s'}}
            onMouseOver={e=>{e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;}}
            onMouseOut={e=>{if(!showSettings){e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;}}}>⚙ Settings</button>
        </div>
      </div>

      {/* ── Body ── */}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>

        {/* ════ TIMER ════ */}
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'20px',padding:'24px',overflowY:'auto',transition:'all .3s'}}>

          {/* Mode tabs */}
          <div style={{display:'flex',gap:'6px',background:theme.surf,borderRadius:'14px',padding:'5px',border:'1px solid '+theme.border,boxShadow:'0 4px 20px rgba(0,0,0,.2)'}}>
            {Object.values(MODE).map(md=>{
              const isActive=mode===md.key;
              const color=md.key==='focus'?theme.focus:md.key==='short'?theme.short:theme.long;
              return(
                <button key={md.key} onClick={()=>switchMode(md.key)} style={{padding:'9px 22px',borderRadius:'10px',border:'none',background:isActive?color:'transparent',color:isActive?'#000':theme.muted,fontWeight:700,fontSize:'13px',cursor:'pointer',transition:'all .2s cubic-bezier(.4,0,.2,1)',boxShadow:isActive?`0 2px 12px ${color}55`:'none'}}
                  onMouseOver={e=>{if(!isActive){e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.text;}}}
                  onMouseOut={e=>{if(!isActive){e.currentTarget.style.background='transparent';e.currentTarget.style.color=theme.muted;}}}>
                  {md.label}
                </button>
              );
            })}
          </div>

          {/* Ring + glow */}
          <div style={{position:'relative'}}>
            <Ring progress={progress} color={modeColor} size={300} theme={theme}>
              <div style={{textAlign:'center'}}>
                <div style={{fontWeight:800,fontSize:'72px',color:theme.text,lineHeight:1,letterSpacing:'-3px',fontVariantNumeric:'tabular-nums',textShadow:`0 0 40px ${modeDim}`}}>{fmt(timeLeft)}</div>
                <div style={{fontSize:'14px',color:modeColor,fontWeight:700,marginTop:'8px',letterSpacing:'1px',textTransform:'uppercase'}}>{modeLabel}</div>
                <div style={{fontSize:'12px',color:theme.muted,marginTop:'6px',background:theme.card,padding:'4px 14px',borderRadius:'20px',border:'1px solid '+theme.border}}>Session {session}</div>
              </div>
            </Ring>
            <div style={{position:'absolute',inset:0,borderRadius:'50%',background:modeDim,filter:'blur(60px)',zIndex:-1,pointerEvents:'none',animation:'pulse 3s ease-in-out infinite'}}/>
          </div>

          {/* Controls */}
          <div style={{display:'flex',gap:'14px',alignItems:'center',marginTop:'8px'}}>
            <IB theme={theme} onClick={reset} title="Reset">↺</IB>
            <button onClick={toggleRun} style={{width:'84px',height:'84px',borderRadius:'50%',background:modeColor,border:'none',color:'#000',fontSize:'30px',fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 8px 40px ${modeColor}66`,transition:'all .2s cubic-bezier(.4,0,.2,1)',cursor:'pointer'}}
              onMouseOver={e=>{e.currentTarget.style.transform='scale(1.08)';e.currentTarget.style.boxShadow=`0 12px 50px ${modeColor}88`;}}
              onMouseOut={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow=`0 8px 40px ${modeColor}66`;}}>
              {running?'⏸':'▶'}
            </button>
            <IB theme={theme} onClick={handleEnd} title="Skip">⏭</IB>
          </div>

          {/* Session dots */}
          <div style={{display:'flex',gap:'10px',alignItems:'center',marginTop:'4px'}}>
            {Array.from({length:settings.longAfter}).map((_,i)=>(
              <div key={i} style={{width:i<session-1?10:8,height:i<session-1?10:8,borderRadius:'50%',background:i<session-1?modeColor:theme.card,border:`2px solid ${i===session-1&&mode==='focus'?modeColor:theme.border}`,transition:'all .35s cubic-bezier(.4,0,.2,1)',boxShadow:i<session-1?`0 0 12px ${modeColor}66`:'none'}}/>
            ))}
            <span style={{fontSize:'12px',color:theme.muted,marginLeft:'6px',fontWeight:500}}>{session}/{settings.longAfter} → Long break</span>
          </div>

          {/* Ambient panel */}
          <div style={{width:'100%',maxWidth:'380px',padding:'16px 18px',background:theme.surf,borderRadius:'16px',border:'1px solid '+theme.border,display:'flex',flexDirection:'column',gap:'12px',boxShadow:'0 4px 20px rgba(0,0,0,.15)'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:'13px',fontWeight:700,color:theme.text}}>🎧 Ambient Sound</span>
              {ambient&&(
                <div style={{display:'flex',alignItems:'center',gap:'8px',width:'120px'}}>
                  <span style={{fontSize:'12px',color:theme.muted}}>🔊</span>
                  <input type="range" min={0} max={100} value={ambVol} onChange={e=>setAmbVol(+e.target.value)} style={{flex:1,color:modeColor}}/>
                </div>
              )}
            </div>
            <div style={{display:'flex',gap:'6px'}}>
              {[['rain','🌧','Rain'],['white','🌫','White Noise'],['focus','🎵','Focus Tones']].map(([k,e,l])=>(
                <button key={k} onClick={()=>toggleAmbient(k)} style={{flex:1,padding:'10px 8px',borderRadius:'12px',border:`2px solid ${ambient===k?modeColor:theme.border}`,background:ambient===k?modeDim:'transparent',color:ambient===k?modeColor:theme.muted,fontSize:'12px',fontWeight:700,transition:'all .18s',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}
                  onMouseOver={e=>{if(ambient!==k){e.currentTarget.style.background=theme.card;e.currentTarget.style.borderColor=theme.accent;}}}
                  onMouseOut={e=>{if(ambient!==k){e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor=theme.border;}}}>
                  <span style={{fontSize:'20px'}}>{e}</span>{l}
                </button>
              ))}
              <button onClick={()=>toggleAmbient(null)} style={{flex:.7,padding:'10px 8px',borderRadius:'12px',border:`2px solid ${!ambient?'#EF4444':theme.border}`,background:!ambient?'rgba(239,68,68,.1)':'transparent',color:!ambient?'#EF4444':theme.muted,fontSize:'12px',fontWeight:700,transition:'all .18s',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
                <span style={{fontSize:'20px'}}>🔇</span>Off
              </button>
            </div>
          </div>
        </div>

        {/* Divider */}
        <div style={{width:'1px',background:theme.border,flexShrink:0}}/>

        {/* ════ SPOTIFY PANEL ════ */}
        <div style={{width:'340px',display:'flex',flexDirection:'column',background:theme.surf,overflow:'hidden',flexShrink:0,transition:'all .3s'}}>
          {!connected?(
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px',gap:'18px',textAlign:'center'}}>
              <div style={{fontSize:'64px',filter:'drop-shadow(0 4px 16px rgba(0,0,0,.4))'}}>🎵</div>
              <div style={{fontWeight:700,fontSize:'19px',color:theme.text}}>Connect Spotify</div>
              <div style={{fontSize:'13px',color:theme.muted,lineHeight:1.8,maxWidth:'260px'}}>Play music alongside your focus sessions. Premium unlocks browser playback; free accounts control any active device.</div>
              <a href="/login" style={{display:'inline-block',padding:'14px 32px',borderRadius:'30px',background:theme.spotify,color:'#000',fontWeight:700,fontSize:'15px',textDecoration:'none',boxShadow:'0 6px 28px rgba(29,185,84,.4)',transition:'all .2s'}}
                onMouseOver={e=>{e.currentTarget.style.transform='scale(1.06)';e.currentTarget.style.boxShadow='0 8px 36px rgba(29,185,84,.55)';}}
                onMouseOut={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow='0 6px 28px rgba(29,185,84,.4)';}}>
                Connect with Spotify
              </a>
              <div style={{fontSize:'11px',color:theme.muted,lineHeight:1.7}}>Redirects to Spotify • Secure OAuth</div>
            </div>
          ):(
            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {/* Header */}
              <div style={{padding:'15px 18px',borderBottom:'1px solid '+theme.border,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
                  <div style={{width:'10px',height:'10px',borderRadius:'50%',background:theme.spotify,boxShadow:`0 0 10px ${theme.spotify}`}}/>
                  <span style={{fontSize:'14px',fontWeight:700,color:theme.text}}>Spotify</span>
                  {!premium&&<span style={{fontSize:'10px',color:theme.muted,background:theme.card,padding:'3px 9px',borderRadius:'12px',border:'1px solid '+theme.border}}>Free</span>}
                  {premium&&<span style={{fontSize:'10px',color:theme.spotify,background:theme.spotify+'15',padding:'3px 9px',borderRadius:'12px',border:'1px solid '+theme.spotify+'33'}}>Premium</span>}
                </div>
                <a href="/logout" style={{color:theme.muted,fontSize:'12px',textDecoration:'none',padding:'5px 10px',borderRadius:'8px',transition:'all .18s'}}
                  onMouseOver={e=>{e.currentTarget.style.color=theme.text;e.currentTarget.style.background=theme.card;}} onMouseOut={e=>{e.currentTarget.style.color=theme.muted;e.currentTarget.style.background='transparent';}}>
                  Disconnect
                </a>
              </div>

              <div style={{flex:1,overflowY:'auto',padding:'16px'}}>

                {/* Now playing */}
                {nowPlay?(
                  <div style={{marginBottom:'18px'}}>
                    <div style={{display:'flex',gap:'14px',alignItems:'center',marginBottom:'14px'}}>
                      {nowPlay.art
                        ?<img src={nowPlay.art} alt="" style={{width:'68px',height:'68px',borderRadius:'12px',objectFit:'cover',flexShrink:0,boxShadow:'0 6px 24px rgba(0,0,0,.5)',border:'1px solid '+theme.border}}/>
                        :<div style={{width:'68px',height:'68px',borderRadius:'12px',background:theme.card,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',flexShrink:0,border:'1px solid '+theme.border}}>🎵</div>
                      }
                      <div style={{minWidth:0,flex:1}}>
                        <div style={{fontWeight:700,fontSize:'14px',color:theme.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:'4px'}}>{nowPlay.name}</div>
                        <div style={{fontSize:'12px',color:theme.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{nowPlay.artist}</div>
                        <div style={{fontSize:'11px',color:theme.muted,marginTop:'4px',opacity:.8}}>{nowPlay.album}</div>
                      </div>
                    </div>
                    <SeekBar position={nowPlay.position} duration={nowPlay.duration} onSeek={seek} theme={theme}/>
                    <div style={{display:'flex',gap:'8px',marginTop:'14px',justifyContent:'center'}}>
                      <IB theme={theme} onClick={prev} title="Previous">⏮</IB>
                      <IB theme={theme} onClick={nowPlay.playing?pause:play} active={nowPlay.playing} title={nowPlay.playing?'Pause':'Play'} style={{width:'48px',height:'48px',fontSize:'20px'}}>{nowPlay.playing?'⏸':'▶'}</IB>
                      <IB theme={theme} onClick={next} title="Next">⏭</IB>
                    </div>
                  </div>
                ):(
                  <div style={{padding:'32px 0',textAlign:'center',color:theme.muted}}>
                    <div style={{fontSize:'42px',marginBottom:'12px',opacity:.5}}>🎵</div>
                    <div style={{fontSize:'13px'}}>Nothing playing</div>
                  </div>
                )}

                {/* Search */}
                <div style={{marginBottom:'16px'}}>
                  <div style={{display:'flex',gap:'8px',marginBottom:'12px'}}>
                    <input type="text" value={searchQ} onChange={e=>setSearchQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch()} placeholder="Search tracks, playlists..."
                      style={{flex:1,padding:'11px 14px',borderRadius:'12px',background:theme.card,border:'1px solid '+theme.border,color:theme.text,fontSize:'13px',outline:'none',transition:'all .18s'}}
                      onFocus={e=>{e.currentTarget.style.borderColor=theme.accent;}} onBlur={e=>{e.currentTarget.style.borderColor=theme.border;}}/>
                    <button onClick={doSearch} style={{padding:'11px 16px',borderRadius:'12px',background:theme.accent,color:'#000',fontWeight:700,fontSize:'13px',transition:'all .18s'}}
                      onMouseOver={e=>{e.currentTarget.style.transform='scale(1.05)';}} onMouseOut={e=>{e.currentTarget.style.transform='scale(1)';}}>Search</button>
                  </div>
                </div>

                {/* Results */}
                {results.length>0&&(
                  <div style={{marginBottom:'16px',maxHeight:'200px',overflowY:'auto'}}>
                    {results.map((r,i)=>(
                      <div key={i} onClick={()=>playUri(r.uri)} style={{display:'flex',gap:'10px',padding:'9px 12px',borderRadius:'10px',cursor:'pointer',transition:'all .15s',border:'1px solid transparent'}}
                        onMouseOver={e=>{e.currentTarget.style.background=theme.card;e.currentTarget.style.borderColor=theme.border;}}
                        onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='transparent';}}>
                        {r.art?<img src={r.art} alt="" style={{width:'42px',height:'42px',borderRadius:'8px',objectFit:'cover'}}/>:<div style={{width:'42px',height:'42px',borderRadius:'8px',background:theme.card,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>🎵</div>}
                        <div style={{minWidth:0,flex:1}}>
                          <div style={{fontWeight:600,fontSize:'12px',color:theme.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</div>
                          <div style={{fontSize:'11px',color:theme.muted,overflow:'hidden',textOverflow:'ellipsis'}}>{r.sub}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Playlists */}
                {playlists.length>0&&(
                  <div>
                    <div style={{fontSize:'12px',fontWeight:700,color:theme.muted,marginBottom:'10px',textTransform:'uppercase',letterSpacing:'.8px'}}>Your Playlists</div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                      {playlists.slice(0,6).map((p,i)=>(
                        <div key={i} onClick={()=>playUri(p.uri)} style={{display:'flex',gap:'8px',padding:'8px',borderRadius:'10px',background:theme.card,border:'1px solid '+theme.border,cursor:'pointer',transition:'all .15s'}}
                          onMouseOver={e=>{e.currentTarget.style.borderColor=theme.accent;e.currentTarget.style.transform='translateY(-2px)';}}
                          onMouseOut={e=>{e.currentTarget.style.borderColor=theme.border;e.currentTarget.style.transform='translateY(0)';}}>
                          {p.images[0]?.url?<img src={p.images[0].url} alt="" style={{width:'36px',height:'36px',borderRadius:'6px',objectFit:'cover'}}/>:<div style={{width:'36px',height:'36px',borderRadius:'6px',background:theme.border,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px'}}>🎵</div>}
                          <div style={{minWidth:0,flex:1}}>
                            <div style={{fontWeight:600,fontSize:'11px',color:theme.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                            <div style={{fontSize:'10px',color:theme.muted}}>Playlist</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Volume */}
                <div style={{marginTop:'16px',paddingTop:'16px',borderTop:'1px solid '+theme.border}}>
                  <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <span style={{fontSize:'12px',color:theme.muted,minWidth:'45px'}}>🔊 Volume</span>
                    <input type="range" min={0} max={100} value={vol} onChange={e=>setVol(+e.target.value)} style={{flex:1,color:theme.spotify}}/>
                    <span style={{fontSize:'11px',color:theme.muted,minWidth:'35px',textAlign:'right'}}>{vol}%</span>
                  </div>
                </div>

              </div>
            </div>
          )}
        </div>
      </div>

      {/* ════ SETTINGS PANEL ════ */}
      {showSettings&&(
        <div class="fu" style={{position:'absolute',top:'66px',right:'24px',width:'320px',background:theme.surf,border:'1px solid '+theme.border,borderRadius:'16px',boxShadow:'0 12px 48px rgba(0,0,0,.4)',zIndex:100,padding:'18px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}}>
            <span style={{fontSize:'15px',fontWeight:700,color:theme.text}}>⚙ Settings</span>
            <button onClick={()=>setShowSettings(false)} style={{fontSize:'18px',color:theme.muted,transition:'color .18s'}} onMouseOver={e=>e.currentTarget.style.color=theme.text} onMouseOut={e=>e.currentTarget.style.color=theme.muted}>×</button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            {[['focus','Focus Duration','min'],['short','Short Break','min'],['long','Long Break','min']].map(([k,l,u])=>(
              <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontSize:'13px',color:theme.text}}>{l}</span>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  <button onClick={()=>setSettings(s=>({...s,[k]:Math.max(1,s[k]-1)}))} style={{width:'32px',height:'32px',borderRadius:'8px',background:theme.card,border:'1px solid '+theme.border,color:theme.muted,fontSize:'18px',transition:'all .15s'}} onMouseOver={e=>{e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;}} onMouseOut={e=>{e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;}}>-</button>
                  <span style={{fontSize:'14px',color:theme.text,minWidth:'24px',textAlign:'center',fontWeight:600}}>{settings[k]}</span>
                  <button onClick={()=>setSettings(s=>({...s,[k]:s[k]+1}))} style={{width:'32px',height:'32px',borderRadius:'8px',background:theme.card,border:'1px solid '+theme.border,color:theme.muted,fontSize:'18px',transition:'all .15s'}} onMouseOver={e=>{e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;}} onMouseOut={e=>{e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;}}>+</button>
                  <span style={{fontSize:'11px',color:theme.muted,minWidth:'25px'}}>{u}</span>
                </div>
              </div>
            ))}
            <div style={{height:'1px',background:theme.border,margin:'4px 0'}}/>
            {[['autoAdv','Auto-advance'],['notifs','Notifications']].map(([k,l])=>(
              <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontSize:'13px',color:theme.text}}>{l}</span>
                <button onClick={()=>setSettings(s=>({...s,[k]:!s[k]}))} style={{width:'48px',height:'26px',borderRadius:'13px',background:settings[k]?theme.accent:theme.card,border:'1px solid '+theme.border,cursor:'pointer',position:'relative',transition:'background .2s'}}>
                  <div style={{width:'20px',height:'20px',borderRadius:'50%',background:'#fff',position:'absolute',top:'2px',transition:'left .2s',left:settings[k]?'24px':'3px'}}/>
                </button>
              </div>
            ))}
            <div style={{height:'1px',background:theme.border,margin:'4px 0'}}/>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:'13px',color:theme.text}}>Long break after</span>
              <div style={{display:'flex',gap:'6px'}}>
                {[3,4,5,6].map(n=>(
                  <button key={n} onClick={()=>setSettings(s=>({...s,longAfter:n}))} style={{width:'34px',height:'34px',borderRadius:'8px',background:settings.longAfter===n?theme.accent:theme.card,border:'1px solid '+theme.border,color:settings.longAfter===n?'#000':theme.muted,fontSize:'13px',fontWeight:700,transition:'all .15s'}}
                    onMouseOver={e=>{if(settings.longAfter!==n){e.currentTarget.style.background=theme.accent+'22';e.currentTarget.style.color=theme.accent;}}}
                    onMouseOut={e=>{if(settings.longAfter!==n){e.currentTarget.style.background=theme.card;e.currentTarget.style.color=theme.muted;}}}>{n}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ════ THEME PICKER ════ */}
      {showThemePicker&&(
        <div class="fu" style={{position:'absolute',top:'66px',right:'200px',width:'280px',background:theme.surf,border:'1px solid '+theme.border,borderRadius:'16px',boxShadow:'0 12px 48px rgba(0,0,0,.4)',zIndex:100,padding:'18px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
            <span style={{fontSize:'15px',fontWeight:700,color:theme.text}}>🎨 Choose Theme</span>
            <button onClick={()=>setShowThemePicker(false)} style={{fontSize:'18px',color:theme.muted,transition:'color .18s'}} onMouseOver={e=>e.currentTarget.style.color=theme.text} onMouseOut={e=>e.currentTarget.style.color=theme.muted}>×</button>
          </div>
          <ThemeSelector current={themeName} onChange={setThemeName} theme={theme}/>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
{% endraw %}
</script>
</body>
</html>
