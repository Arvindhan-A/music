<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pomodoro × Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:#0A0A16;color:#E8E8FF;overflow:hidden;}
input,button,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2A2A4A;border-radius:4px;}

/* Range inputs */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%;height:20px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#2A2A4A;border-radius:4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:currentColor;margin-top:-5px;transition:transform .12s;box-shadow:0 0 6px currentColor;}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);}
input[type=range]::-moz-range-track{height:4px;background:#2A2A4A;border-radius:4px;}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:currentColor;border:none;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.fu{animation:fadeUp .2s ease both;}
.pop{animation:pop .16s ease both;}

/* ── Responsive layout ── */
.layout{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.body-row{display:flex;flex:1;overflow:hidden;min-height:0;}
.timer-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto;gap:14px;min-width:0;}
.spotify-col{width:320px;flex-shrink:0;display:flex;flex-direction:column;background:#12121E;border-left:1px solid rgba(255,255,255,.08);overflow:hidden;}

/* Mobile: stack vertically, spotify below timer */
@media(max-width:700px){
  .body-row{flex-direction:column;}
  .spotify-col{width:100%;border-left:none;border-top:1px solid rgba(255,255,255,.08);max-height:52vh;}
  .timer-col{padding:12px 10px;gap:10px;justify-content:flex-start;padding-top:16px;}
  .ring-wrap svg{width:220px!important;height:220px!important;}
  .ring-wrap{width:220px!important;height:220px!important;}
  .time-num{font-size:46px!important;}
  .ctrl-play{width:58px!important;height:58px!important;font-size:22px!important;}
  .ctrl-sm{width:32px!important;height:32px!important;font-size:14px!important;}
  .mode-tabs button{padding:6px 12px!important;font-size:12px!important;}
  .ambient-panel{max-width:100%!important;width:100%!important;}
  .session-dots{font-size:10px!important;}
}
@media(max-width:400px){
  .ring-wrap{width:190px!important;height:190px!important;}
  .ring-wrap svg{width:190px!important;height:190px!important;}
  .time-num{font-size:40px!important;}
}
button:focus-visible{outline:2px solid rgba(255,255,255,.25);outline-offset:2px;}
</style>
</head>
<body>
<div id="root"></div>
<script>window.onSpotifyWebPlaybackSDKReady=()=>{window.__sdkReady=true;if(window.__sdkRes){window.__sdkRes();window.__sdkRes=null;}};</script>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

/* ── Tokens ── */
const T={
  bg:'#0A0A16',surf:'#12121E',card:'#1A1A2E',
  border:'rgba(255,255,255,.08)',
  text:'#E8E8FF',mid:'#A0A0C0',muted:'#505070',
  focus:'#34D399',short:'#818CF8',long:'#C084FC',
  spotify:'#1DB954',danger:'#EF4444',
};
const MODE={
  focus:{key:'focus',label:'Focus',      color:T.focus, dim:'rgba(52,211,153,.13)', secs:25*60},
  short:{key:'short',label:'Short Break',color:T.short, dim:'rgba(129,140,248,.13)',secs:5*60},
  long: {key:'long', label:'Long Break', color:T.long,  dim:'rgba(192,132,252,.13)',secs:15*60},
};

/* ── Token helper — fetches from Flask /api/token ── */
let _tok=null,_tokExp=0;
const getToken=async()=>{
  if(_tok&&Date.now()<_tokExp-10000)return _tok;
  try{
    const r=await fetch('/api/token');
    if(!r.ok){_tok=null;return null;}
    const d=await r.json();
    if(d.error){_tok=null;return null;}
    _tok=d.access_token;_tokExp=Date.now()+50*60*1000;
    return _tok;
  }catch{return null;}
};

/* ── Spotify API wrapper ── */
const sapi=async(path,method='GET',body=null)=>{
  const tok=await getToken();if(!tok)return null;
  try{
    const r=await fetch('https://api.spotify.com/v1'+path,{
      method,
      headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:body?JSON.stringify(body):null,
    });
    if(r.status===204||r.status===202)return{ok:true};
    if(r.status===200&&method!=='GET')return{ok:true};
    if(!r.ok){const e=await r.json().catch(()=>({}));console.warn('Spotify API',r.status,e);return null;}
    return r.json();
  }catch(e){console.error('sapi',e);return null;}
};

/* ── Ambient audio (Web Audio) ── */
const makeAmbient=(type,vol)=>{
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const gain=ctx.createGain();gain.gain.value=(vol/100)*0.22;gain.connect(ctx.destination);
    const srcs=[];
    if(type==='rain'){
      const sz=ctx.sampleRate*4,buf=ctx.createBuffer(2,sz,ctx.sampleRate);
      for(let c=0;c<2;c++){const d=buf.getChannelData(c);let l=0;for(let i=0;i<sz;i++)d[i]=l=(l+.02*(Math.random()*2-1))/1.02*3.5;}
      const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;
      const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
      s.connect(f);f.connect(gain);s.start();srcs.push(s);
    }else if(type==='white'){
      const sz=ctx.sampleRate*2,buf=ctx.createBuffer(1,sz,ctx.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<sz;i++)d[i]=Math.random()*2-1;
      const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.connect(gain);s.start();srcs.push(s);
    }else if(type==='focus'){
      [[200,-1],[210,1]].forEach(([f,pan])=>{
        const o=ctx.createOscillator(),p=ctx.createStereoPanner(),g=ctx.createGain();
        o.frequency.value=f;p.pan.value=pan;g.gain.value=0.18;
        o.connect(g);g.connect(p);p.connect(gain);o.start();srcs.push(o);
      });
    }
    return{setVol:v=>gain.gain.setTargetAtTime((v/100)*0.22,ctx.currentTime,.05),stop:()=>{srcs.forEach(s=>{try{s.stop();}catch{}});try{ctx.close();}catch{}}};
  }catch{return null;}
};

const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

/* ── SVG Ring ── */
function Ring({progress,color,size,children}){
  const r=size/2-14,circ=2*Math.PI*r,off=circ*(1-Math.max(0,Math.min(1,progress||0)));
  return(
    <div className="ring-wrap" style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{position:'absolute',inset:0,transform:'rotate(-90deg)'}}>
        <defs>
          <filter id="glo" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx={size/2} cy={size/2} r={r} stroke={color+'28'} strokeWidth={11} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={11} fill="none"
          strokeDasharray={circ} strokeDashoffset={off}
          strokeLinecap="round" filter="url(#glo)"
          style={{transition:'stroke-dashoffset .5s linear,stroke .35s ease'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        {children}
      </div>
      {/* Glow blob */}
      <div style={{position:'absolute',inset:'10%',borderRadius:'50%',background:color+'18',filter:'blur(30px)',zIndex:-1,pointerEvents:'none'}}/>
    </div>
  );
}

/* ── Seek bar ── */
function SeekBar({position,duration,color,onSeek}){
  const[pos,setPos]=useState(position||0);
  const dragging=useRef(false);
  useEffect(()=>{if(!dragging.current)setPos(position||0);},[position]);
  const pct=Math.min(100,(pos/Math.max(1,duration||1))*100);
  return(
    <div style={{display:'flex',alignItems:'center',gap:'8px',width:'100%'}}>
      <span style={{fontSize:'11px',color:T.muted,minWidth:'34px',tabularNums:true}}>{fmt(Math.floor(pos/1000))}</span>
      <div style={{flex:1,position:'relative',height:'20px',display:'flex',alignItems:'center'}}>
        <div style={{position:'absolute',left:0,right:0,height:'4px',background:'rgba(255,255,255,.1)',borderRadius:'4px',overflow:'hidden'}}>
          <div style={{width:pct+'%',height:'100%',background:color||T.spotify,borderRadius:'4px',transition:'width .5s linear'}}/>
        </div>
        <input type="range" min={0} max={Math.max(1,duration||1)} value={pos} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer',color:T.spotify}}
          onChange={e=>setPos(+e.target.value)}
          onMouseDown={()=>dragging.current=true}
          onTouchStart={()=>dragging.current=true}
          onMouseUp={e=>{dragging.current=false;onSeek(+e.target.value);}}
          onTouchEnd={e=>{dragging.current=false;onSeek(+e.target.changedTouches[0]?pos:pos);}}/>
      </div>
      <span style={{fontSize:'11px',color:T.muted,minWidth:'34px',textAlign:'right'}}>{fmt(Math.floor((duration||0)/1000))}</span>
    </div>
  );
}

/* ── Small round icon button ── */
const IBtn=({children,onClick,title,active,color,size=36})=>(
  <button onClick={onClick} title={title} className="ctrl-sm" style={{width:size,height:size,borderRadius:'50%',border:'1px solid '+(active?color||T.mid:T.border),background:active?(color+'22'||'rgba(255,255,255,.07)'):'rgba(255,255,255,.04)',color:active?color||T.text:T.mid,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',flexShrink:0}}
    onMouseOver={e=>{if(!active){e.currentTarget.style.background='rgba(255,255,255,.09)';e.currentTarget.style.color=T.text;}}}
    onMouseOut={e=>{if(!active){e.currentTarget.style.background='rgba(255,255,255,.04)';e.currentTarget.style.color=T.mid;}}}>
    {children}
  </button>
);

/* ══════════════════════════
   MAIN APP
══════════════════════════ */
function App(){
  /* ── Timer state ── */
  const[mode,setMode]=useState('focus');
  const[timeLeft,setTimeLeft]=useState(25*60);
  const[running,setRunning]=useState(false);
  const[session,setSession]=useState(1);
  const[settings,setSettings]=useState({focus:25,short:5,long:15,autoAdv:true,longAfter:4,notifs:false});
  const[showSettings,setShowSettings]=useState(false);
  const timerRef=useRef(null);
  const totalRef=useRef(25*60);

  /* ── Spotify state ── */
  const[connected]=useState({{connected|tojson}});
  const[premium,setPremium]=useState(false);
  const[nowPlay,setNowPlay]=useState(null);
  const[deviceId,setDeviceId]=useState(null);
  const[vol,setVol]=useState(80);
  const[searchQ,setSearchQ]=useState('');
  const[results,setResults]=useState([]);
  const[playlists,setPlaylists]=useState([]);
  const[searching,setSearching]=useState(false);
  const pollRef=useRef(null);
  const playerRef=useRef(null);
  const[tab,setTab]=useState('playlists'); // 'playlists' | 'search'

  /* ── Ambient state ── */
  const[ambient,setAmbient]=useState(null);
  const[ambVol,setAmbVol]=useState(30);
  const ambRef=useRef(null);

  /* ── Spotify init ── */
  useEffect(()=>{
    if(!connected)return;
    (async()=>{
      const me=await sapi('/me');
      const isPrem=me?.product==='premium';setPremium(isPrem);
      const pl=await sapi('/me/playlists?limit=30');
      if(pl?.items)setPlaylists(pl.items.filter(Boolean));
      if(isPrem)initSDK();else startPoll();
    })();
  },[]);

  const initSDK=async()=>{
    const sc=document.createElement('script');sc.src='https://sdk.scdn.co/spotify-player.js';document.head.appendChild(sc);
    await new Promise(res=>{if(window.__sdkReady)res();else window.__sdkRes=res;});
    const player=new window.Spotify.Player({
      name:'Pomodoro × GaiaSentinel',
      getOAuthToken:async cb=>{const t=await getToken();if(t)cb(t);},
      volume:vol/100,
    });
    player.addListener('ready',({device_id})=>{
      setDeviceId(device_id);
      sapi('/me/player','PUT',{device_ids:[device_id]});
    });
    player.addListener('player_state_changed',st=>{
      if(!st)return;
      const tr=st.track_window?.current_track;if(!tr)return;
      setNowPlay({
        name:tr.name,
        artist:tr.artists?.map(a=>a.name).join(', ')||'',
        album:tr.album?.name||'',
        art:tr.album?.images?.[0]?.url||null,
        playing:!st.paused,
        duration:st.duration,
        position:st.position,
        uri:tr.uri,
      });
    });
    player.connect();playerRef.current=player;
  };

  const startPoll=()=>{
    const poll=async()=>{
      const d=await sapi('/me/player');
      if(!d?.item)return;
      setNowPlay({
        name:d.item.name,
        artist:d.item.artists?.map(a=>a.name).join(', ')||'',
        album:d.item.album?.name||'',
        art:d.item.album?.images?.[0]?.url||null,
        playing:d.is_playing,
        duration:d.item.duration_ms,
        position:d.progress_ms,
        uri:d.item.uri,
      });
    };
    poll();pollRef.current=setInterval(poll,3000);
  };

  /* Volume sync to SDK player */
  useEffect(()=>{if(playerRef.current)playerRef.current.setVolume(vol/100);},[vol]);
  /* Cleanup */
  useEffect(()=>()=>{ambRef.current?.stop();clearInterval(pollRef.current);playerRef.current?.disconnect();},[]);

  /* ── Spotify controls ── */
  const spPlay  =()=>sapi(`/me/player/play${deviceId?'?device_id='+deviceId:''}`, 'PUT');
  const spPause =()=>sapi('/me/player/pause','PUT');
  const spNext  =()=>sapi('/me/player/next','POST');
  const spPrev  =()=>sapi('/me/player/previous','POST');
  const spSeek  =ms=>sapi(`/me/player/seek?position_ms=${Math.round(ms)}${deviceId?'&device_id='+deviceId:''}`, 'PUT');
  const spVol   =v=>sapi(`/me/player/volume?volume_percent=${Math.round(v)}`, 'PUT');

  const playUri=async uri=>{
    if(!uri)return;
    const isTrack=uri.includes(':track:');
    const body=isTrack?{uris:[uri]}:{context_uri:uri};
    if(deviceId)body.device_id=deviceId;
    await sapi('/me/player/play','PUT',body);
  };

  /* ── Search ── */
  const doSearch=async()=>{
    const q=searchQ.trim();if(!q)return;
    setSearching(true);setTab('search');
    try{
      const d=await sapi(`/search?q=${encodeURIComponent(q)}&type=track,playlist&limit=10`);
      if(!d){setResults([]);return;}
      const tracks=(d.tracks?.items||[]).filter(Boolean).map(t=>({
        type:'track',name:t.name,
        sub:t.artists?.map(a=>a.name).join(', '),
        art:t.album?.images?.[2]?.url||t.album?.images?.[0]?.url||null,
        uri:t.uri,
      }));
      const pls=(d.playlists?.items||[]).filter(Boolean).map(p=>({
        type:'playlist',name:p.name,
        sub:p.owner?.display_name||'',
        art:p.images?.[0]?.url||null,
        uri:p.uri,
      }));
      setResults([...tracks,...pls]);
    }finally{setSearching(false);}
  };

  const handleVolChange=async v=>{
    setVol(v);
    if(playerRef.current)playerRef.current.setVolume(v/100);
    else await spVol(v);
  };

  /* ── Timer logic ── */
  const switchMode=useCallback(k=>{
    clearInterval(timerRef.current);setRunning(false);
    const secs=settings[k==='focus'?'focus':k==='short'?'short':'long']*60;
    totalRef.current=secs;setMode(k);setTimeLeft(secs);
  },[settings]);

  const handleEnd=useCallback(()=>{
    if(settings.notifs&&'Notification'in window&&Notification.permission==='granted')
      new Notification(mode==='focus'?'⏰ Break time! Well done 🎉':'🎯 Back to focus!');
    if(settings.autoAdv){
      if(mode==='focus'){
        const ns=session>=settings.longAfter?1:session+1;
        const nm=session>=settings.longAfter?'long':'short';
        setSession(ns);switchMode(nm);setRunning(true);
      }else{setSession(s=>mode==='long'?1:s);switchMode('focus');setRunning(true);}
    }else setRunning(false);
  },[mode,session,settings,switchMode]);

  useEffect(()=>{
    if(!running)return;
    timerRef.current=setInterval(()=>{
      setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);handleEnd();return 0;}return t-1;});
    },1000);
    return()=>clearInterval(timerRef.current);
  },[running,handleEnd]);

  const toggleRun=()=>{
    if(!running&&timeLeft===0){const s=settings[mode==='focus'?'focus':mode==='short'?'short':'long']*60;setTimeLeft(s);totalRef.current=s;}
    setRunning(r=>!r);
  };
  const reset=()=>{clearInterval(timerRef.current);setRunning(false);const s=settings[mode==='focus'?'focus':mode==='short'?'short':'long']*60;setTimeLeft(s);totalRef.current=s;};

  /* ── Keyboard shortcuts ── */
  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.code==='Space'){e.preventDefault();toggleRun();}
      if(e.code==='KeyR')reset();
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[running,mode,settings,timeLeft]);

  /* ── Ambient ── */
  const toggleAmbient=type=>{
    ambRef.current?.stop();ambRef.current=null;
    if(ambient===type){setAmbient(null);return;}
    const a=makeAmbient(type,ambVol);
    if(a){ambRef.current=a;setAmbient(type);}
  };
  useEffect(()=>{ambRef.current?.setVol(ambVol);},[ambVol]);

  const requestNotif=async()=>{
    const p=await Notification.requestPermission();
    if(p==='granted')setSettings(s=>({...s,notifs:true}));
  };

  /* ── Derived ── */
  const m=MODE[mode];
  const progress=totalRef.current>0?timeLeft/totalRef.current:0;
  const urlError=new URLSearchParams(location.search).get('error');

  /* ── Result / playlist row ── */
  const MediaRow=({item})=>(
    <button onClick={()=>playUri(item.uri)} style={{display:'flex',gap:'10px',alignItems:'center',padding:'7px 8px',borderRadius:'9px',background:'transparent',border:'1px solid transparent',cursor:'pointer',textAlign:'left',width:'100%',transition:'all .12s'}}
      onMouseOver={e=>{e.currentTarget.style.background=T.card;e.currentTarget.style.borderColor=T.border;}}
      onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='transparent';}}>
      {item.art
        ?<img src={item.art} alt="" style={{width:40,height:40,borderRadius:6,objectFit:'cover',flexShrink:0}}/>
        :<div style={{width:40,height:40,borderRadius:6,background:T.card,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{item.type==='playlist'?'📋':'🎵'}</div>
      }
      <div style={{minWidth:0,flex:1}}>
        <div style={{fontSize:'12px',fontWeight:600,color:T.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
        <div style={{fontSize:'10px',color:T.muted,marginTop:'1px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.type==='playlist'?'Playlist':'Track'}{item.sub?' · '+item.sub:''}</div>
      </div>
      <span style={{fontSize:'12px',color:T.muted,flexShrink:0}}>▶</span>
    </button>
  );

  return(
    <div className="layout">

      {/* Error banner */}
      {urlError&&(
        <div style={{background:'#7F1D1D',padding:'8px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,fontSize:'13px'}}>
          <span style={{color:'#FCA5A5'}}>⚠ Spotify error: {decodeURIComponent(urlError)}</span>
          <a href="/" style={{color:'#FCA5A5',textDecoration:'none',fontWeight:600}}>× Dismiss</a>
        </div>
      )}

      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 18px',borderBottom:'1px solid '+T.border,flexShrink:0,background:T.surf}}>
        <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
          <span style={{fontSize:'19px'}}>🍅</span>
          <span style={{fontWeight:700,fontSize:'15px',letterSpacing:'-.2px'}}>Pomodoro</span>
          <span style={{width:'1px',height:'14px',background:T.border}}/>
          <span style={{fontSize:'11px',color:T.muted,display:'none'}} id="kb-hint">Space · start &nbsp;R · reset</span>
        </div>
        <div style={{display:'flex',gap:'7px'}}>
          {'Notification'in window&&Notification.permission==='default'&&(
            <button onClick={requestNotif} style={{padding:'5px 11px',borderRadius:'8px',background:T.card,border:'1px solid '+T.border,color:T.mid,fontSize:'11px',cursor:'pointer'}}>🔔</button>
          )}
          <button onClick={()=>setShowSettings(s=>!s)} style={{padding:'5px 12px',borderRadius:'8px',background:showSettings?m.color:T.card,border:'1px solid '+(showSettings?m.color:T.border),color:showSettings?'#000':T.mid,fontSize:'11px',fontWeight:600,cursor:'pointer',transition:'all .18s'}}>
            ⚙ Settings
          </button>
        </div>
      </div>

      <div className="body-row">

        {/* ══════ TIMER COLUMN ══════ */}
        <div className="timer-col">

          {/* Mode tabs */}
          <div className="mode-tabs" style={{display:'flex',gap:'3px',background:T.surf,borderRadius:'12px',padding:'4px',border:'1px solid '+T.border}}>
            {Object.values(MODE).map(md=>(
              <button key={md.key} onClick={()=>switchMode(md.key)} style={{padding:'7px 16px',borderRadius:'8px',border:'none',background:mode===md.key?m.color:'transparent',color:mode===md.key?'#000':T.muted,fontWeight:600,fontSize:'13px',cursor:'pointer',transition:'all .18s',whiteSpace:'nowrap'}}>
                {md.label}
              </button>
            ))}
          </div>

          {/* Ring */}
          <Ring progress={progress} color={m.color} size={280}>
            <div style={{textAlign:'center',userSelect:'none'}}>
              <div className="time-num" style={{fontWeight:700,fontSize:'60px',color:T.text,lineHeight:1,letterSpacing:'-2px',fontVariantNumeric:'tabular-nums'}}>{fmt(timeLeft)}</div>
              <div style={{fontSize:'12px',color:m.color,fontWeight:700,marginTop:'5px',letterSpacing:'1px',textTransform:'uppercase'}}>{m.label}</div>
              <div style={{fontSize:'11px',color:T.muted,marginTop:'3px'}}>Session {session}</div>
            </div>
          </Ring>

          {/* Controls */}
          <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
            <IBtn onClick={reset} title="Reset (R)">↺</IBtn>
            <button onClick={toggleRun} className="ctrl-play" style={{width:68,height:68,borderRadius:'50%',background:m.color,border:'none',color:'#000',fontSize:26,cursor:'pointer',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 0 28px ${m.color}44`,transition:'all .18s',transform:running?'scale(.95)':'scale(1)'}}>
              {running?'⏸':'▶'}
            </button>
            <IBtn onClick={handleEnd} title="Skip session">⏭</IBtn>
          </div>

          {/* Session dots */}
          <div className="session-dots" style={{display:'flex',gap:'7px',alignItems:'center',fontSize:'11px',color:T.muted}}>
            {Array.from({length:settings.longAfter}).map((_,i)=>(
              <div key={i} style={{width:i<session-1?10:7,height:i<session-1?10:7,borderRadius:'50%',background:i<session-1?m.color:T.border,border:i===session-1&&mode==='focus'?'2px solid '+m.color:'2px solid transparent',transition:'all .28s'}}/>
            ))}
            <span style={{marginLeft:'3px'}}>{session}/{settings.longAfter} → Long</span>
          </div>

          {/* Ambient sounds */}
          <div className="ambient-panel" style={{padding:'12px 14px',background:T.surf,borderRadius:'14px',border:'1px solid '+T.border,width:'100%',maxWidth:'340px',display:'flex',flexDirection:'column',gap:'10px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:'12px',fontWeight:600,color:T.mid}}>🎧 Ambient</span>
              {ambient&&(
                <div style={{display:'flex',alignItems:'center',gap:'7px',flex:1,marginLeft:'12px',color:m.color}}>
                  <span style={{fontSize:'11px',color:T.muted,flexShrink:0}}>🔊</span>
                  <input type="range" min={0} max={100} value={ambVol} onChange={e=>setAmbVol(+e.target.value)} style={{color:m.color,flex:1}}/>
                  <span style={{fontSize:'11px',color:T.muted,minWidth:'28px'}}>{ambVol}%</span>
                </div>
              )}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px'}}>
              {[['rain','🌧','Rain'],['white','🌫','White'],['focus','🎵','Focus']].map(([k,e,l])=>(
                <button key={k} onClick={()=>toggleAmbient(k)} style={{padding:'8px 4px',borderRadius:'10px',border:`1px solid ${ambient===k?m.color:T.border}`,background:ambient===k?m.dim:'transparent',color:ambient===k?m.color:T.muted,fontSize:'11px',fontWeight:600,cursor:'pointer',transition:'all .15s',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',lineHeight:1}}>
                  <span style={{fontSize:'20px'}}>{e}</span>{l}
                </button>
              ))}
              <button onClick={()=>toggleAmbient(null)} style={{padding:'8px 4px',borderRadius:'10px',border:`1px solid ${!ambient?T.danger:T.border}`,background:!ambient?'rgba(239,68,68,.12)':'transparent',color:!ambient?T.danger:T.muted,fontSize:'11px',fontWeight:600,cursor:'pointer',transition:'all .15s',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',lineHeight:1}}>
                <span style={{fontSize:'20px'}}>🔇</span>Off
              </button>
            </div>
          </div>

        </div>{/* end timer col */}

        {/* Divider (desktop only) */}
        <div style={{width:'1px',background:T.border,flexShrink:0}}/>

        {/* ══════ SPOTIFY COLUMN ══════ */}
        <div className="spotify-col">
          {!connected?(
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px',gap:'16px',textAlign:'center'}}>
              <div style={{fontSize:'48px'}}>🎵</div>
              <div style={{fontWeight:700,fontSize:'17px'}}>Connect Spotify</div>
              <div style={{fontSize:'13px',color:T.muted,lineHeight:1.7}}>Control music while you focus. Premium = browser playback; Free = control any active device.</div>
              <a href="/login" style={{padding:'12px 28px',borderRadius:'30px',background:T.spotify,color:'#000',fontWeight:700,fontSize:'14px',textDecoration:'none',display:'block',boxShadow:'0 4px 20px rgba(29,185,84,.3)'}}>
                Connect with Spotify
              </a>
            </div>
          ):(
            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

              {/* Spotify header */}
              <div style={{padding:'11px 14px',borderBottom:'1px solid '+T.border,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
                  <div style={{width:'8px',height:'8px',borderRadius:'50%',background:T.spotify,boxShadow:'0 0 7px '+T.spotify}}/>
                  <span style={{fontSize:'13px',fontWeight:700}}>Spotify</span>
                  <span style={{fontSize:'10px',padding:'1px 7px',borderRadius:'10px',background:premium?'rgba(29,185,84,.15)':T.card,color:premium?T.spotify:T.muted}}>
                    {premium?'Premium':'Free'}
                  </span>
                </div>
                <a href="/logout" style={{color:T.muted,fontSize:'11px',textDecoration:'none',padding:'3px 8px',borderRadius:'6px',transition:'color .12s'}}
                  onMouseOver={e=>e.currentTarget.style.color=T.text} onMouseOut={e=>e.currentTarget.style.color=T.muted}>
                  Disconnect
                </a>
              </div>

              <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:'12px'}}>

                {/* Now playing */}
                {nowPlay?(
                  <div style={{background:T.card,borderRadius:'12px',padding:'12px',border:'1px solid '+T.border}}>
                    <div style={{display:'flex',gap:'11px',alignItems:'center',marginBottom:'10px'}}>
                      {nowPlay.art
                        ?<img src={nowPlay.art} alt="" style={{width:54,height:54,borderRadius:'8px',objectFit:'cover',flexShrink:0,boxShadow:'0 3px 12px rgba(0,0,0,.5)'}}/>
                        :<div style={{width:54,height:54,borderRadius:'8px',background:T.surf,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>🎵</div>
                      }
                      <div style={{minWidth:0,flex:1}}>
                        <div style={{fontWeight:700,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:T.text}}>{nowPlay.name}</div>
                        <div style={{fontSize:'11px',color:T.muted,marginTop:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{nowPlay.artist}</div>
                        <div style={{fontSize:'10px',color:T.muted,marginTop:'3px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontStyle:'italic'}}>{nowPlay.album}</div>
                      </div>
                    </div>
                    <SeekBar position={nowPlay.position} duration={nowPlay.duration} color={T.spotify} onSeek={spSeek}/>
                    {/* Playback controls */}
                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',marginTop:'10px'}}>
                      <IBtn onClick={spPrev}>⏮</IBtn>
                      <button onClick={nowPlay.playing?spPause:spPlay}
                        style={{width:46,height:46,borderRadius:'50%',background:T.spotify,border:'none',color:'#000',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 14px rgba(29,185,84,.4)',transition:'transform .15s'}}
                        onMouseOver={e=>e.currentTarget.style.transform='scale(1.07)'} onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}>
                        {nowPlay.playing?'⏸':'▶'}
                      </button>
                      <IBtn onClick={spNext}>⏭</IBtn>
                    </div>
                    {/* Volume */}
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'10px',color:T.spotify}}>
                      <span style={{fontSize:'13px',color:T.muted,flexShrink:0}}>🔈</span>
                      <input type="range" min={0} max={100} value={vol} onChange={e=>handleVolChange(+e.target.value)} style={{flex:1,color:T.spotify}}/>
                      <span style={{fontSize:'11px',color:T.muted,minWidth:'32px',textAlign:'right'}}>{vol}%</span>
                      <span style={{fontSize:'13px',color:T.muted,flexShrink:0}}>🔊</span>
                    </div>
                  </div>
                ):(
                  <div style={{textAlign:'center',padding:'14px',background:T.card,borderRadius:'12px',color:T.muted,fontSize:'13px',border:'1px solid '+T.border}}>
                    <div style={{fontSize:'26px',marginBottom:'6px',opacity:.4}}>🎵</div>
                    {premium?'Connecting player…':'Open Spotify on any device, then control it here.'}
                  </div>
                )}

                {/* Search bar */}
                <div style={{display:'flex',gap:'6px',alignItems:'stretch'}}>
                  <input
                    value={searchQ}
                    onChange={e=>setSearchQ(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&doSearch()}
                    placeholder="Search tracks, playlists…"
                    style={{flex:1,background:T.card,border:'1px solid '+T.border,borderRadius:'9px',padding:'9px 13px',fontSize:'13px',color:T.text,outline:'none',transition:'border-color .15s',minWidth:0}}
                    onFocus={e=>e.target.style.borderColor=T.spotify}
                    onBlur={e=>e.target.style.borderColor=T.border}
                  />
                  <button onClick={doSearch} disabled={searching||!searchQ.trim()}
                    style={{padding:'9px 14px',borderRadius:'9px',background:searching?T.muted:T.spotify,border:'none',color:'#000',fontWeight:700,fontSize:'13px',cursor:searching?'wait':'pointer',flexShrink:0,transition:'background .15s',opacity:!searchQ.trim()?0.5:1}}>
                    {searching?'…':'Search'}
                  </button>
                </div>

                {/* Tabs: playlists / search results */}
                <div style={{display:'flex',gap:'4px',background:T.surf,borderRadius:'8px',padding:'3px'}}>
                  {[['playlists',`Playlists (${playlists.length})`],['search',`Results (${results.length})`]].map(([k,l])=>(
                    <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:'5px 8px',borderRadius:'6px',border:'none',background:tab===k?T.card:'transparent',color:tab===k?T.text:T.muted,fontSize:'11px',fontWeight:600,cursor:'pointer',transition:'all .15s'}}>
                      {l}
                    </button>
                  ))}
                </div>

                {/* Playlists list */}
                {tab==='playlists'&&(
                  <div style={{display:'flex',flexDirection:'column',gap:'2px'}}>
                    {playlists.length===0&&<div style={{textAlign:'center',color:T.muted,fontSize:'12px',padding:'12px'}}>No playlists found</div>}
                    {playlists.map((p,i)=><MediaRow key={i} item={{type:'playlist',name:p.name,sub:p.tracks?.total+' tracks',art:p.images?.[0]?.url||null,uri:p.uri}}/>)}
                  </div>
                )}

                {/* Search results list */}
                {tab==='search'&&(
                  <div style={{display:'flex',flexDirection:'column',gap:'2px'}}>
                    {results.length===0&&<div style={{textAlign:'center',color:T.muted,fontSize:'12px',padding:'12px'}}>{searching?'Searching…':'Type above and press Search'}</div>}
                    {results.map((r,i)=><MediaRow key={i} item={r}/>)}
                    {results.length>0&&<button onClick={()=>{setResults([]);setTab('playlists');}} style={{fontSize:'11px',color:T.muted,background:'none',border:'none',cursor:'pointer',padding:'5px',marginTop:'2px',borderRadius:'6px'}}>← Back to playlists</button>}
                  </div>
                )}

              </div>
            </div>
          )}
        </div>

      </div>{/* end body-row */}

      {/* ══════ SETTINGS MODAL ══════ */}
      {showSettings&&(
        <div style={{position:'fixed',inset:0,background:'rgba(10,10,22,.82)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(8px)',padding:'16px'}} onClick={e=>e.target===e.currentTarget&&setShowSettings(false)}>
          <div style={{background:T.card,border:'1px solid '+T.border,borderRadius:'18px',padding:'24px',width:'100%',maxWidth:'380px',boxShadow:'0 20px 60px rgba(0,0,0,.6)',maxHeight:'90vh',overflowY:'auto'}} className="pop">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
              <span style={{fontWeight:700,fontSize:'17px'}}>⚙ Settings</span>
              <button onClick={()=>setShowSettings(false)} style={{background:T.surf,border:'1px solid '+T.border,borderRadius:'50%',width:'30px',height:'30px',color:T.muted,cursor:'pointer',fontSize:'16px',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
            </div>
            {[
              ['focus','🍅 Focus',1,90],
              ['short','☕ Short Break',1,30],
              ['long','🌿 Long Break',1,45],
              ['longAfter','🔁 Sessions before long break',2,8],
            ].map(([k,l,mn,mx])=>(
              <div key={k} style={{marginBottom:'16px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:'5px'}}>
                  <label style={{fontSize:'13px',color:T.mid}}>{l}</label>
                  <span style={{fontSize:'13px',fontWeight:700}}>{settings[k]}{k!=='longAfter'?' min':''}</span>
                </div>
                <input type="range" min={mn} max={mx} value={settings[k]} style={{color:m.color}}
                  onChange={e=>{
                    const v=+e.target.value;setSettings(s=>({...s,[k]:v}));
                    if((k==='focus'&&mode==='focus')||(k==='short'&&mode==='short')||(k==='long'&&mode==='long')){totalRef.current=v*60;setTimeLeft(v*60);}
                  }}/>
              </div>
            ))}
            <div style={{height:'1px',background:T.border,margin:'14px 0'}}/>
            {[['autoAdv','Auto-advance between sessions'],['notifs','Notifications when session ends']].map(([k,l])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                <span style={{fontSize:'13px',color:T.mid}}>{l}</span>
                <button onClick={()=>{if(k==='notifs'&&!settings.notifs){requestNotif();return;}setSettings(s=>({...s,[k]:!s[k]}));}}
                  style={{width:'44px',height:'24px',borderRadius:'12px',background:settings[k]?m.color:T.surf,border:'1px solid '+T.border,cursor:'pointer',position:'relative',transition:'background .2s',flexShrink:0}}>
                  <div style={{width:'18px',height:'18px',borderRadius:'50%',background:'#fff',position:'absolute',top:'2px',transition:'left .2s',left:settings[k]?'22px':'3px'}}/>
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
